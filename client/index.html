    <script data-nami-theme>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('nami-theme') ?? localStorage.getItem('revelio-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
