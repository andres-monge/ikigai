adding:30px 30px 24px;min-height:640px}.column{max-width:640px;margin:auto}.user{margin:0 0 26px auto;background:#fff8f0;padding:13px 18px;max-width:410px;border:1px solid #d4cec4}.assistant{margin-bottom:22px}.assistant>p{margin-bottom:18px}.project{background:white;border:2px solid #171512;box-shadow:4px 4px #171512;margin:18px 0 24px}.project-title{background:#dff3f1;padding:20px 24px;border-bottom:2px solid #171512}.project-title h2{font-size:25px;margin-bottom:0}.section{padding:20px 24px}.section+.section{border-top:1px solid #ddd7cd}.learning{background:#fff8f0}.section p,.section li{font-size:16px;line-height:1.65}.steps{margin:10px 0 0;padding-left:23px}.steps li+li{margin-top:13px}.steps strong{display:block}.steps span{display:block}.support{border-left:4px solid #4ebcb1;padding:3px 0 3px 16px;font-size:16px;line-height:1.6;margin:22px 0}.support strong{display:block;margin-bottom:5px}.inline-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.inline-actions button{font-size:14px}.composer{background:#f4f2f0;border-top:1px solid #d4cec4;padding:18px 30px}.composer-inner{max-width:640px;margin:auto;display:flex;gap:12px;background:white;border:2px solid #171512;padding:10px 12px}.composer textarea{width:100%;min-height:46px;max-height:130px;resize:vertical;border:0;background:white;font:inherit;font-size:16px;line-height:1.5;padding:8px;outline-offset:1px}.send{background:#4ebcb1;align-self:end;min-width:44px;padding:8px}.notice{max-width:640px;margin:8px auto 0;font-size:12px;color:#514a40}.guide{background:#fff8f0;border:1px solid #c9bfae;padding:18px;margin-top:18px}.guide h3{margin-bottom:10px}.guide ol{padding-left:22px;margin:0}.guide li+li{margin-top:7px}.mini{font-size:14px;color:#514a40}.map-heading{margin-bottom:22px}.map-heading p{font-size:15px;color:#514a40;margin-top:7px}.saved{font-size:14px;margin-top:9px}.mapcontext{margin-bottom:22px;border-bottom:1px solid #c9bfae;padding-bottom:18px}.mapcontext span{font-size:13px;color:#514a40}.mapcontext strong{display:block;font-size:17px}.next{background:#dff3f1;border:1px solid #007567;padding:18px;margin-top:18px}.details{border-top:1px solid #ddd7cd}.details summary{padding:16px 24px;font-size:15px;font-weight:700;cursor:pointer}.details summary:hover{background:#fff8f0}.details .section{border-top:1px solid #ddd7cd}.message-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.short-project h3{margin-top:22px}.short-project h3:first-child{margin-top:0}.short-project{padding-bottom:20px;border-bottom:1px solid #c9bfae}.message{margin:22px 0}.message.you{background:#fff8f0;border:1px solid #d4cec4;padding:12px 17px;margin-left:auto;max-width:390px}.map-linknote{font-size:15px;margin-top:25px}.bottom-space{height:3px}
@media(max-width:720px){.compare{padding:16px}.options{gap:7px}.options button{padding:10px;font-size:13px}.options b{font-size:14px}.options span{font-size:12px}.app{margin:16px 12px}.brandbar{padding:15px;flex-wrap:wrap}.tagline{display:none}.surface{padding:24px 18px;min-height:600px}.section{padding:17px}.project-title{padding:18px 17px}.composer{padding:15px}.project-title h2{font-size:23px}.compare-note{font-size:13px}}
</style></head><body><div class="compare"><div class="compare-inner"><p class="compare-heading">Project presentation · Three product options</p><div class="options" role="group" aria-label="Presentation options"><button data-option="a" aria-pressed="true"><b>A · Complete brief</b><span>All the essentials in one place.</span></button><button data-option="b" aria-pressed="false"><b>B · Overview + details</b><span>Show the first action; reveal more on demand.</span></button><button data-option="c" aria-pressed="false"><b>C · Guided conversation</b><span>Develop the starting steps through dialogue.</span></button></div><p class="compare-note" id="principle"></p><div class="scenario"><span>Compare the experience:</span><button data-scene="proposal" aria-pressed="true">First project proposal</button><button data-scene="return" aria-pressed="false">Return after acceptance</button></div></div></div><div id="stage"></div><script>
const learning=`Do you enjoy shaping how sound becomes something visual, and find yourself wanting to develop it further? Notice which adjustments draw you in and which feel like a chore.`;
const make=`Make a small interactive piece for yourself: one shape that grows when a sound gets louder. The first version is ready when you can try a few sounds and see the shape respond. It doesn't need to be polished.`;
const support=`You don't have to work out the rest on your own. Bring me questions, show me what you've made, or tell me where you're stuck. We'll work out the next steps together as you go.`;
const steps=`<ol class="steps"><li><strong>Open a simple sound-and-shape example.</strong><span>Start with the p5.js Mic Input example, a small drawing that responds to your microphone. Press Run, allow microphone access if asked, then hum or clap. First, just see it respond; no code changes yet.</span></li><li><strong>Make one change that feels like yours.</strong><span>Try a different colour or change how much the shape grows. Adjust one thing, run it, and see what happens.</span></li><li><strong>Play with it, then decide what to try next.</strong><span>Try different sounds. Notice what you want to improve and how you feel about doing that work. Bring that back here and we'll choose the next small step together.</span></li></ol>`;
const first=`<h3>Start here</h3><p>Open the p5.js Mic Input example, a small drawing that responds to your microphone. Press Run, allow microphone access if asked, then hum or clap. Your first small result is seeing the drawing respond.</p><p class="mini">No need to plan the whole project or install a complicated setup. If you haven't used an editor before, we can do that first action together.</p>`;
const help=`<div class="support"><strong>I'll help you as you go.</strong>${support}</div>`;
const principles={a:'Everything is visible before you decide: the learning question, the first version and three starting actions. Return to the same complete brief later.',b:'A compact overview keeps the learning question, the first version and the first action visible. Open the details when you want the rest of the starting guidance.',c:'The first proposal explains the learning and the result. Starting guidance unfolds in conversation. Your Map keeps a compact reminder, and Chat carries the developing guidance.'};
let variant='a',scene='proposal',panel='chat',guideLevel=0,messages=[];
function card(){return `<article class="project"><header class="project-title"><h2>Your first sound-responsive sketch</h2></header><section class="section learning"><h3>What you'll learn</h3><p>${learning}</p></section><section class="section"><h3>What you'll make</h3><p>${make}</p></section>${variant==='a'?`<section class="section"><h3>How to get started</h3>${steps}</section>`:`<section class="section">${first}</section><details class="details"><summary>See the other starting steps</summary><section class="section">${steps.replace(/<li>.*?<\/li>/, "").replace('<ol class="steps">', '<ol class="steps" start="2">')}</section></details>`}</article>`}
function conversational(){return `<div class="short-project"><h2>Your first sound-responsive sketch</h2><h3>What you'll learn</h3><p>${learning}</p><h3>What you'll make</h3><p>${make}</p></div>${help}<p>How does that first version sound?</p><div class="message-actions"><button class="primary" data-guide="1">Show me how to start</button><button class="secondary" data-compose="I'd like to change the first version.">I'd like to change it</button></div>${guideLevel>=1?`<div class="message you">Show me how to start.</div><div class="message">${first}<div class="message-actions"><button class="secondary" data-guide="2">I'm new to this. Walk me through it.</button><button class="secondary" data-guide="3">What comes after that?</button></div></div>`:''}${guideLevel===2?`<div class="message you">I'm new to this. Walk me through it.</div>${beginner()}`:''}${guideLevel===3?`<div class="message you">What comes after that?</div><div class="guide"><h3>Next, make one change.</h3><p>Try a different colour or change how much the shape grows. Change one thing at a time so you can see what it does.</p><p>Then play with it. What do you find yourself wanting to change next? We can shape the next step from that.</p></div>`:''}`}
function beginner(){return `<div class="guide"><h3>Let's start with opening and running it.</h3><ol><li>Open the p5.js Mic Input example. It already contains the starting drawing, so you do not need to make a blank project.</li><li>Press the Run button beneath the example. Leave the code as it is for now.</li><li>If it asks to use your microphone, allow it, then make a sound.</li></ol><p style="margin-top:12px">Tell me whether you see a shape moving, or what appears instead. We'll take the next step from there.</p></div>`}
function map(){return `<div class="map-heading"><h2>Your Map</h2><p>Your project, ready to return to.</p></div><div class="mapcontext"><span>Your selected path</span><strong>Make interactive art</strong></div>${variant==='c'?`<article class="project"><header class="project-title"><h2>Your first sound-responsive sketch</h2></header><section class="section learning"><h3>What you're learning</h3><p>${learning}</p></section><section class="section"><h3>Your first version</h3><p>${make}</p><div class="next"><h3>Your starting point</h3><p>Open the p5.js Mic Input example and press Run. Then return to Chat and we'll shape what comes next.</p></div></section></article>`:card()}<p class="saved">Accepted project · Not started</p><p class="map-linknote">${variant==='a'?'The steps above are a starting plan, not something you have to figure out alone.':variant==='b'?'Your first action stays visible. Open the details whenever you want more of the plan.':'The project stays here; the guidance continues in Chat.'} Switch to <strong>Chat</strong> whenever you need help. ${support}</p>`}
function render(){document.querySelector('#principle').textContent=principles[variant];document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.option===variant));document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===scene));document.querySelector('#stage').innerHTML=`<div data-ce-variant="${variant}" class="app"><header class="brandbar"><div><span class="brand">Revelio</span><span class="tagline"> &nbsp; Figure out what to work on next</span></div><nav class="nav" aria-label="Revelio"><button data-panel="chat" aria-selected="${panel==='chat'}">Chat</button><button data-panel="map" aria-selected="${panel==='map'}">Your Map</button></nav></header><main class="surface"><div class="column">${panel==='map'?map():`${scene==='proposal'?'<div class="user">I want to try the interactive art path.</div>':'<div class="user">I’m back. Help me get started with my project.</div>'}<div class="assistant">${variant==='c'?conversational():`<p>Let's turn that sound-responsive piece into a first version you can actually start.</p>${card()}${help}<p>What would you change to make this feel right for you?</p><div class="inline-actions"><button class="secondary" data-help>Walk me through the first step</button><button class="secondary" data-compose="I'd like to change the scope.">I'd like to adjust it</button></div>`}</div><div id="messages">${messages.map(m=>m).join('')}</div>`}</div></main>${panel==='chat'?`<footer class="composer"><form class="composer-inner"><textarea rows="1" aria-label="Message Revelio" placeholder="Reply, ask, or push back."></textarea><button class="send" aria-label="Send message">↑</button></form><p class="notice">Presentation prototype · Replies shown here are examples; no model call or saved project.</p></footer>`:''}</div>`;
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{panel=b.dataset.panel;render()});document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{guideLevel=Number(b.dataset.guide);render()});document.querySelectorAll('[data-compose]').forEach(b=>b.onclick=()=>{const t=document.querySelector('textarea');t.value=b.dataset.compose;t.focus()});document.querySelectorAll('[data-help]').forEach(b=>b.onclick=()=>{messages.push('<div class="message you">Walk me through the first step.</div>'+beginner());render();document.querySelector('#messages').scrollIntoView({block:'nearest'})});const form=document.querySelector('form');if(form)form.onsubmit=e=>{e.preventDefault();const t=form.querySelector('textarea');if(!t.value.trim())return;const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');messages.push('<div class="message you">'+escape(t.value)+'</div><div class="guide"><p>In the working app, this is where Revelio would respond to your question or help adjust the project. This preview compares the presentation and amount of information.</p></div>');render();document.querySelector('#messages').scrollIntoView({block:'nearest'})};}
document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{variant=b.dataset.option;guideLevel=0;messages=[];render()});document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;panel=scene==='return'?'map':'chat';guideLevel=0;messages=[];render()});render();
</script></body></html>
